name: Render profile

on:
  workflow_dispatch:
  push:
    paths:
      - "profile.json"
      - "README_TEMPLATE.md"
      - "scripts/render_profile.py"

permissions:
  contents: write

jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Render complete editorial profile
        run: python3 scripts/render_profile.py

      - name: Commit generated profile
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md assets/*.svg
          if ! git diff --cached --quiet; then
            git commit -m "chore: render profile"
            git push
          fi
