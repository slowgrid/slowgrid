name: Render profile and writing

on:
  workflow_dispatch:
  schedule:
    - cron: "17 0 * * *"
  push:
    paths:
      - "profile.json"
      - "README_TEMPLATE.md"
      - "scripts/render_profile.py"
      - "scripts/update_blog_posts.py"
      - ".github/workflows/render-profile.yml"

permissions:
  contents: write

concurrency:
  group: render-profile
  cancel-in-progress: true

jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Render editorial profile
        run: python3 scripts/render_profile.py

      - name: Render editorial writing cards
        run: python3 scripts/update_blog_posts.py

      - name: Commit generated profile
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md assets/*.svg
          if ! git diff --cached --quiet; then
            git commit -m "chore: render profile and writing"
            git push
          fi
